name: Build decks

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "inspect = report; smoke = a few searches; sample = a judgeable contact sheet; full = build and release"
        type: choice
        options: [inspect, smoke, sample, full]
        default: inspect
      drive_file_id:
        description: "Drive file id of the source .apkg (shared with anyone-with-the-link)"
        default: "1aCxAzLPFzQ_Q16XGs93UBTz9eaKD-BkK"
      image_limit:
        description: "Fetch images for at most this many notes (0 = all)"
        default: "0"
      max_edge:
        description: "Longest image edge in pixels (400 small / 600 balanced / 800 large)"
        default: "600"
      allow_placeholders:
        description: "Generate a text card when no image is found"
        type: boolean
        default: false
      release_tag:
        description: "Release tag to publish the built decks under"
        default: "decks-latest"
      use_llm:
        description: "Rewrite the image queries with a language model (needs OPENROUTER_API_KEY)"
        type: boolean
        default: false
      llm_model:
        description: "OpenRouter model id"
        default: "google/gemini-2.5-flash"
      llm_sample_notes:
        description: "On the sample stage, how many notes the model should tag"
        default: "600"
      validate_images:
        description: "On the sample stage, also have a vision model judge each picture"
        type: boolean
        default: false
      sample_size:
        description: "How many random concepts the sample stage should fetch"
        default: "80"
      sample_seed:
        description: "Seed for the random sample, so a run can be repeated"
        default: "1"
      upgrade_from:
        description: "Re-search hits from these providers, e.g. 'openverse' after adding a better API key"
        default: ""
      time_budget:
        description: "Minutes to spend fetching before settling for what was found (0 = no limit)"
        default: "120"
      min_coverage:
        description: "Fail a full build if fewer than this share of concepts got an image (0-1)"
        default: "0.35"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # Hoisted to job level so the steps below can test them in `if:`.
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_PARENT_ID: ${{ secrets.GDRIVE_PARENT_ID }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Compiling catches what a plain parse does not (bad `global`, and such).
      - name: Syntax-check the scripts
        run: python -m compileall -q scripts

      # The source deck is large and never changes; keep it between runs.
      - name: Cache source deck
        uses: actions/cache@v4
        with:
          path: source/source_deck.apkg
          key: source-deck-${{ inputs.drive_file_id }}

      - name: Download source deck
        run: python scripts/download_deck.py --drive-id "${{ inputs.drive_file_id }}"

      - name: Unpack
        run: python scripts/unpack.py

      - name: Tag notes into searchable concepts
        run: python scripts/tag_notes.py --sample 20

      - name: Refine the tags with a language model
        if: inputs.use_llm
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.llm_model }}
        run: |
          EXTRA=""
          if [ "${{ inputs.stage }}" = "sample" ]; then
            EXTRA="--sample ${{ inputs.llm_sample_notes }}"
          fi
          python scripts/llm_tags.py --workers 4 $EXTRA

      - name: Report scale
        run: python scripts/estimate.py | tee scale-report.txt

      - name: Upload unpacked notes
        uses: actions/upload-artifact@v4
        with:
          name: notes
          path: |
            data/notes.json
            data/tags.json
            scale-report.txt

      - name: Stop after inspection
        if: inputs.stage == 'inspect'
        run: echo "Inspection done -- rerun with stage=smoke or stage=full."

      # ---- smoke: prove the image providers actually answer -----------------

      - name: Smoke-test the image providers
        if: inputs.stage == 'smoke'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python scripts/fetch_images.py \
            --limit 24 --workers 3 --max-edge "${{ inputs.max_edge }}" --no-placeholder
          python - <<'PY'
          import json, pathlib, sys
          doc = json.loads(pathlib.Path("data/images.json").read_text())["images"]
          if not doc:
              sys.exit("SMOKE FAILED: every provider came back empty for all 24 queries")
          print(f"fetched {len(doc)}/24")
          for entry in list(doc.values())[:24]:
              print(f"  {entry['query']:<34} {entry['provider']:<12} {entry['bytes']:>7,} B")
          PY

      # ---- sample: a random slice, rendered so quality can be judged --------

      - name: Fetch a random sample
        if: inputs.stage == 'sample'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ inputs.use_llm }}" = "true" ]; then
            EXTRA="--only-strategy llm"
          fi
          python scripts/fetch_images.py \
            --sample "${{ inputs.sample_size }}" \
            --seed "${{ inputs.sample_seed }}" \
            --max-edge "${{ inputs.max_edge }}" \
            --workers 4 --no-placeholder $EXTRA

      - name: Contact sheet, before any validation
        if: inputs.stage == 'sample'
        run: |
          PYTHONPATH=scripts python scripts/contact_sheet.py --max 200 \
            --out build/sheet-query-only.html \
            --title "A -- model rewrote the query only"

      - name: Have a model look at the pictures
        if: inputs.stage == 'sample' && inputs.validate_images
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.llm_model }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: PYTHONPATH=scripts python scripts/llm_validate.py --requery --workers 4

      - name: Contact sheet, after validation
        if: inputs.stage == 'sample' && inputs.validate_images
        run: |
          PYTHONPATH=scripts python scripts/contact_sheet.py --max 200 \
            --out build/sheet-validated.html \
            --title "B -- model also judged each picture"

      - name: Upload both contact sheets
        if: inputs.stage == 'sample'
        uses: actions/upload-artifact@v4
        with:
          name: contact-sheet
          path: |
            build/sheet-query-only.html
            build/sheet-validated.html
            build/validation-report.json
            data/images.json

      - name: Upload the smoke images for eyeballing
        if: inputs.stage == 'smoke'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-images
          path: |
            build/images
            data/images.json

      # ---- everything below only runs for a full build -------------------

      - name: Restore the image cache
        if: inputs.stage == 'full'
        run: |
          mkdir -p build/images data
          if gh release download "${{ inputs.release_tag }}" --pattern images.zip --dir /tmp 2>/dev/null; then
            unzip -q -o /tmp/images.zip -d build/images
            echo "restored $(find build/images -name '*.jpg' | wc -l) images from the last release"
          elif gh run download --name image-cache --dir /tmp/partial 2>/dev/null; then
            # What a run that failed or was cancelled managed to fetch.
            unzip -q -o /tmp/partial/image-cache.zip -d build/images 2>/dev/null || true
            cp -f /tmp/partial/images.json data/images.json 2>/dev/null || true
            echo "resumed $(find build/images -name '*.jpg' | wc -l) images from a partial run"
          else
            echo "no image cache to restore"
          fi

      - name: Fetch images
        if: inputs.stage == 'full'
        continue-on-error: true
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ inputs.allow_placeholders }}" != "true" ]; then
            EXTRA="--no-placeholder"
          fi
          if [ -n "${{ inputs.upgrade_from }}" ]; then
            EXTRA="$EXTRA --upgrade-from ${{ inputs.upgrade_from }}"
          fi
          python scripts/fetch_images.py \
            --limit "${{ inputs.image_limit }}" \
            --max-edge "${{ inputs.max_edge }}" \
            --time-budget "${{ inputs.time_budget }}" \
            --workers 4 \
            $EXTRA

      # Everything above this point is expensive and easy to lose: the fetch
      # persists nothing off the runner, so a failure later in the job used to
      # throw away the whole download. always() keeps it.
      - name: Preserve the image cache, even on failure
        if: always() && inputs.stage == 'full'
        run: |
          mkdir -p build/images
          ( cd build/images && zip -q -r "$GITHUB_WORKSPACE/image-cache.zip" . ) || true
          ls -la image-cache.zip 2>/dev/null || echo "nothing fetched yet"

      - name: Upload the image cache
        if: always() && inputs.stage == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: image-cache
          if-no-files-found: warn
          retention-days: 30
          path: |
            image-cache.zip
            data/images.json
            data/tags.json
            data/notes.json

      # The whole point of the judging pass is the deck, not the sample.
      - name: Have a model judge the pictures
        if: inputs.stage == 'full' && inputs.validate_images
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.llm_model }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: PYTHONPATH=scripts python scripts/llm_validate.py --requery --workers 6

      # Judging replaces pictures and rewrites the manifest, so save again.
      - name: Preserve the cache after judging
        if: always() && inputs.stage == 'full' && inputs.validate_images
        run: |
          mkdir -p build/images
          rm -f image-cache.zip
          ( cd build/images && zip -q -r "$GITHUB_WORKSPACE/image-cache.zip" . ) || true

      - name: Upload the cache after judging
        if: always() && inputs.stage == 'full' && inputs.validate_images
        uses: actions/upload-artifact@v4
        with:
          name: image-cache
          overwrite: true
          if-no-files-found: warn
          retention-days: 30
          path: |
            image-cache.zip
            data/images.json
            data/tags.json
            data/notes.json
            build/validation-report.json

      - name: Contact sheet for the finished build
        if: inputs.stage == 'full'
        continue-on-error: true
        run: |
          PYTHONPATH=scripts python scripts/contact_sheet.py --max 300 \
            --out build/contact-sheet.html \
            --title "Spanish deck -- what each card looks up"

      - name: Mirror images to Google Drive
        if: inputs.stage == 'full' && env.GDRIVE_SERVICE_ACCOUNT_JSON != ''
        run: python scripts/gdrive_sync.py --share

      - name: Check image coverage before building
        if: inputs.stage == 'full'
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          images = json.loads(pathlib.Path("data/images.json").read_text())["images"] \
              if pathlib.Path("data/images.json").exists() else {}
          tags = json.loads(pathlib.Path("data/tags.json").read_text())["tags"]
          concepts = {t["concept_key"] for t in tags.values() if t.get("concept_key")}
          got, want = len(images), len(concepts)
          share = got / want if want else 0.0
          floor = float("${{ inputs.min_coverage }}")
          print(f"image coverage: {got:,}/{want:,} concepts = {share:.1%} (floor {floor:.0%})")
          if share < floor:
              sys.exit(
                  "Refusing to publish: the image fetch covered too little to be worth a "
                  "release. Fix the fetch and re-run -- the cache makes a re-run cheap."
              )
          PY

      - name: Build both decks
        if: inputs.stage == 'full'
        run: python scripts/build_decks.py

      - name: Verify the built decks
        if: inputs.stage == 'full'
        run: PYTHONPATH=scripts python scripts/verify_decks.py

      - name: Pack the image cache for the release
        if: inputs.stage == 'full'
        run: cp image-cache.zip /tmp/images.zip && ls -la /tmp/images.zip

      - name: Commit the image manifest
        if: inputs.stage == 'full'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/images.json
          git commit -m "Refresh image manifest" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Write release notes
        if: inputs.stage == 'full'
        run: |
          {
            echo "Built from the Tatoeba source deck by \`.github/workflows/build-decks.yml\`."
            echo
            echo "- \`spanish_es-en_hinted-image.apkg\` - Spanish on the front with audio, context image behind a hint button."
            echo "- \`spanish_en-es_hinted-audio.apkg\` - English and the image on the front, Spanish audio behind a hint button."
            echo "- \`images.zip\` - the image cache, reused by later runs."
            echo
            echo '```'
            cat scale-report.txt
            echo '```'
          } > release-notes.md

      - name: Publish the decks
        if: inputs.stage == 'full'
        run: |
          gh release delete "${{ inputs.release_tag }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${{ inputs.release_tag }}" \
            --title "Spanish decks ($(date -u +%Y-%m-%d))" \
            --notes-file release-notes.md \
            dist/spanish_es-en_hinted-image.apkg \
            dist/spanish_en-es_hinted-audio.apkg \
            data/tags.json \
            build/contact-sheet.html \
            /tmp/images.zip
